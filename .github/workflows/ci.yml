name: Enterprise Data Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  pipeline-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: analytics_user
          POSTGRES_PASSWORD: analytics_password
          POSTGRES_DB: analytics_warehouse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U analytics_user -d analytics_warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Warehouse Raw Data
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: analytics_user
          DB_PASS: analytics_password
          DB_NAME: analytics_warehouse
        run: |
          python data/generate_data.py

      - name: Run dbt Transformations & Schema Tests
        run: |
          cd dbt_project
          dbt run --profiles-dir .
          dbt test --profiles-dir .

      - name: Run Great Expectations Assertions
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: analytics_user
          DB_PASS: analytics_password
          DB_NAME: analytics_warehouse
        run: |
          python analysis/validate_expectations.py