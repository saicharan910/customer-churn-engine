postgres_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'analytics_user') }}"
      password: "{{ env_var('DB_PASS', 'analytics_password') }}"
      port: "{{ env_var('DB_PORT', 5433) | int }}"
      dbname: "{{ env_var('DB_NAME', 'analytics_warehouse') }}"
      schema: public
      threads: 4